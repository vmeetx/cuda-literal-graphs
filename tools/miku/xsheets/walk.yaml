# Cheerful walk in a 3/4 (diagonal) view, facing right (left = mirror). 12 fps; 12 ticks = 1 s.
# Study: a relaxed chibi stroll - body turned a little toward the viewer, head over the hips,
# arms open (leek held up in the travel-side hand, other arm out low), small crossing steps,
# closed happy eyes and an open smile. Contacts and passings held 2 ticks, downs and ups 1.
# Body bobs down 1 px at contact/down and up 1 px at passing/up; the planted foot stays put.
# Tails sway wide, 2 ticks behind; skirt hem and leek leaves lag a pixel.
clip: walk
view: diagonal
loop: true
frames:
  - {drawing: contact_r, ticks: 2, key: true}
  - {drawing: down_r, ticks: 1}
  - {drawing: pass_r, ticks: 2, key: true}
  - {drawing: up_r, ticks: 1}
  - {drawing: contact_l, ticks: 2, key: true}
  - {drawing: down_l, ticks: 1}
  - {drawing: pass_l, ticks: 2, key: true}
  - {drawing: up_l, ticks: 1}
