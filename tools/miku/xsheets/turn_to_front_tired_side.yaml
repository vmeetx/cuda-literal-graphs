# FALLBACK for walk_tired_side.
# Tired: side -> 3/4 -> front (facing right; left = mirror). The tails swing through the turn.
clip: turn_to_front_tired_side
view: turn
loop: false
frames:
  - {drawing: side_stand, ticks: 2, key: true}
  - {drawing: three_quarter, ticks: 2, swing: -0.45}
  - {drawing: front, ticks: 2, key: true}
